name: realtime

on:
  push:
    branches: [main]
    paths: &paths
      - services/realtime/**
      - packages/**
      - services/Dockerfile
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/_service.yml
      - .github/workflows/realtime.yml
  pull_request:
    paths: *paths
  # Run by hand from the Actions tab (path filters can't see a branch's first push).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realtime:
    uses: ./.github/workflows/_service.yml
    with:
      service: realtime
    permissions:
      contents: read
      packages: write
