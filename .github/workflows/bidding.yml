name: bidding

on:
  push:
    branches: [main]
    paths: &paths
      - services/bidding/**
      - packages/**
      - services/Dockerfile
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/_service.yml
      - .github/workflows/bidding.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bidding:
    uses: ./.github/workflows/_service.yml
    with:
      service: bidding
    permissions:
      contents: read
      packages: write
