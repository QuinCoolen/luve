name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build API
        run: pnpm --filter luve-api build

      # Regenerate the contract artifacts from source, then fail if either the
      # exported spec or the generated client differs from what's committed.
      # `openapi:export` boots Nest in preview mode, so no DB/Redis is needed —
      # the env below is only to satisfy boot-time validation.
      - name: Export OpenAPI spec
        run: pnpm openapi:export
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-placeholder-secret-32-characters-long
          JWT_ACCESS_TTL: 15m
          JWT_REFRESH_TTL: 30d
          CORS_ORIGIN: http://localhost:3000
          COOKIE_DOMAIN: localhost

      - name: Generate API client
        run: pnpm --filter luve-web api:generate

      - name: Fail if contract artifacts are stale
        run: git diff --exit-code -- luve-api/openapi.json luve-web/src/api/generated

      - name: Test API
        run: pnpm --filter luve-api test

      - name: Build web
        run: pnpm --filter luve-web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5218
