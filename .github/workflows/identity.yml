name: identity

on:
  push:
    branches: [main]
    paths: &paths
      - services/identity/**
      - apps/web/orval.config.ts
      - apps/web/src/api/generated/identity/**
      - packages/**
      - services/Dockerfile
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/_service.yml
      - .github/workflows/identity.yml
  pull_request:
    paths: *paths
  # Run by hand from the Actions tab (path filters can't see a branch's first push).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    uses: ./.github/workflows/_service.yml
    with:
      service: identity
      web-client: true
    permissions:
      contents: read
      packages: write
