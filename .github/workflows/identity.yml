name: identity

on:
  push:
    branches: [main]
    paths: &paths
      - services/identity/**
      - packages/**
      - services/Dockerfile
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/_service.yml
      - .github/workflows/identity.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    uses: ./.github/workflows/_service.yml
    with:
      service: identity
    permissions:
      contents: read
      packages: write
