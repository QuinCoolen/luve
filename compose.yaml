# Luve local stack.
#
#   pnpm infra:up   → infrastructure only (Postgres, Redis, RabbitMQ, Traefik);
#                     run the services + web on the host with `pnpm dev`.
#   pnpm stack:up   → everything in containers (adds the `apps` profile and
#                     points Traefik at the containers via infra/docker.env).
#
# Browse the app and every API through the gateway: http://localhost:8000
name: luve

x-app: &app
  profiles: [apps]
  restart: unless-stopped
  build: &app-build
    context: .
    dockerfile: services/Dockerfile
  depends_on: &app-deps
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  # --- infrastructure ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: luve
      POSTGRES_PASSWORD: luve
      POSTGRES_DB: luve
    ports: ['5433:5432'] # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luve -d luve']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - '5673:5672' # AMQP
      - '15673:15672' # management UI (user/pass: luve/luve)
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-luve.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:8000
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - '8000:8000' # the one browser origin: web app + /api/v1/* + /socket.io
      - '8088:8080' # Traefik dashboard
    volumes:
      # host/ routes to `pnpm dev` processes, docker/ to the app containers.
      - ./infra/traefik/${TRAEFIK_DYNAMIC:-host}:/etc/traefik/dynamic:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- apps (profile: apps) ---------------------------------------------------
  auth:
    <<: *app
    build: { <<: *app-build, args: { SERVICE: auth } }
    # Apply pending migrations, then start.
    command: ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && node dist/main.js']
    environment:
      DATABASE_URL: postgresql://luve:luve@postgres:5432/auth
      RABBITMQ_URL: amqp://luve:luve@rabbitmq:5672
      # No JWT_PRIVATE_KEY: auth generates an ephemeral signing key at boot
      # (clients transparently refresh after a restart). Set one to keep tokens
      # valid across restarts.

  users:
    <<: *app
    build: { <<: *app-build, args: { SERVICE: users } }
    command: ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && node dist/main.js']
    environment:
      DATABASE_URL: postgresql://luve:luve@postgres:5432/users
      RABBITMQ_URL: amqp://luve:luve@rabbitmq:5672

  auctions:
    <<: *app
    build: { <<: *app-build, args: { SERVICE: auctions } }

  bidding:
    <<: *app
    build: { <<: *app-build, args: { SERVICE: bidding } }

  payments:
    <<: *app
    build: { <<: *app-build, args: { SERVICE: payments } }

  realtime:
    <<: *app
    build: { <<: *app-build, args: { SERVICE: realtime } }

  web:
    profiles: [apps]
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side rendering calls the API through the gateway container.
      INTERNAL_API_URL: http://traefik:8000
    depends_on:
      traefik: { condition: service_healthy }

volumes:
  pgdata:
