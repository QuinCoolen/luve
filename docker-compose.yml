services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: luve
      POSTGRES_PASSWORD: luve
      POSTGRES_DB: luve
    # Host port 5433 (not 5432) to avoid clashing with a local Postgres install.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luve -d luve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Host port 6380 (not 6379) to avoid clashing with a local Redis install.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./luve-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5218"
      DATABASE_URL: postgresql://luve:luve@postgres:5432/luve?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me-please-32-chars-min
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_DOMAIN: localhost
    ports:
      - "5218:5218"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5218/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
